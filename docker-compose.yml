version: '3.8'

services:
  # --- 1. Backend Django (avec SQLite) ---
  backend:
    build: ./backend
    container_name: devinterview_backend
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app  # Persiste votre fichier db.sqlite3 et votre code en local
    ports:
      - "8000:8000"

  # --- 2. Frontend React / Nginx ---
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: devinterview_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend